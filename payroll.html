/* ---------- 3.3% 계산 ---------- */
function tax(gross,mode){
  gross=Math.max(0,Math.round(gross));
  if(mode==='round'){const tot=Math.round(gross*33/1000);const inc=Math.round(gross*3/100);return{inc,loc:tot-inc,tot}}

  const loc=Math.floor(inc/100)*10;                // 지방소득세 = 소득세의 10%, 10원 미만 버림
  return{inc,loc,tot:inc+loc};
}

function saveFile(filename,data){const b=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function normWork(o){for(const k in o){const d=o[k];if(d&&Array.isArray(d.days)){const m={};d.days.forEach((v,i)=>{if(v)m[pad(i)]=v});d.days=m}}return o}
function blocker(html){let b=document.getElementById('blocker');if(!html){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='blocker';document.body.appendChild(b)}b.innerHTML=`<div class="lockbox">${html}</div>`}

    let denied=false;const fail=()=>{if(denied)return;denied=true;blocker('<h2>이 계정은 급여장부를 볼 수 없어요</h2><p class="sub">급여장부는 원장님 계정으로만 열 수 있어요.</p>')};
    const sub=(col,key)=>db.ref('payroll/'+col).on('value',snap=>{let o=snap.val()||{};if(key==='work')o=normWork(o);R[key]=o;dbReady=true;if(!X)render()},fail);

let unlocked=false,idleT=null;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function pinGate(){
  if(unlocked){blocker(null);return}
  if(!R.pin){blocker(`<h2>급여장부 비밀번호 정하기</h2><p class="sub">급여장부를 열 때마다 한 번 더 넣는 비밀번호예요. 숫자 4~6자리로 정해주세요.</p><input id="pin1" type="password" inputmode="numeric" maxlength="6" placeholder="새 비밀번호"><input id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="한 번 더"><button class="brand" onclick="setPin()">정하기</button><p id="pinErr" class="sub" style="color:var(--bad)"></p>`);setTimeout(()=>{const e=$('#pin1');e&&e.focus()},50);return}
  blocker(`<h2>🔒 급여장부</h2><p class="sub">급여 비밀번호를 넣어주세요.</p><input id="pin1" type="password" inputmode="numeric" maxlength="6" placeholder="비밀번호" onkeydown="if(event.key==='Enter')tryPin()"><button class="brand" onclick="tryPin()">열기</button><p id="pinErr" class="sub" style="color:var(--bad)"></p>`);setTimeout(()=>{const e=$('#pin1');e&&e.focus()},50);
}
async function setPin(){const a=$('#pin1').value.trim(),b=$('#pin2').value.trim();if(!/^\d{4,6}$/.test(a)){$('#pinErr').textContent='숫자 4~6자리로 넣어주세요';return}if(a!==b){$('#pinErr').textContent='두 번 넣은 비밀번호가 달라요';return}const salt=Math.random().toString(36).slice(2,12);await db.ref('payroll/config/pin').set({salt,hash:await sha(salt+a)});unlocked=true;bumpIdle();pinGate();toast('급여 비밀번호를 정했어요')}
async function tryPin(){const a=$('#pin1').value.trim();if(R.pin&&await sha(R.pin.salt+a)===R.pin.hash){unlocked=true;bumpIdle();pinGate();render()}else{$('#pinErr').textContent='비밀번호가 맞지 않아요';$('#pin1').value=''}}
function lockNow(){unlocked=false;closeSlip&&closeSlip();pinGate()}
function bumpIdle(){clearTimeout(idleT);idleT=setTimeout(lockNow,10*60*1000)}
['click','keydown','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(unlocked)bumpIdle()},{passive:true}));
async function resetPin(){if(UI.confirm!=='pinreset'){UI.confirm='pinreset';render();return}UI.confirm=null;await db.ref('payroll/config/pin').remove();unlocked=false;toast('비밀번호를 지웠어요. 새로 정해주세요');pinGate()}
async function importBackup(file){
  if(!file)return;let d;try{d=JSON.parse(await file.text())}catch(e){toast('백업 파일을 읽지 못했어요');return}
  const map={teachers:'teachers',work:'work',settle:'settlements',exp:'expenses',pay:'payments'};const up={};let n=0;
  for(const k in map){const o=d[k]||{};for(const id in o){up[map[k]+'/'+id]=o[id];n++}}
  if(d.settings)up['config/settings']=d.settings;if(d.fixed)up['config/fixed']=d.fixed;
  try{await db.ref('payroll').update(clean(up));toast('자료 '+n+'건을 불러왔어요')}catch(e){handleErr(e)}
}

/* ---------- 근무 기록 ---------- */
function daysOf(tid){
  const out=[];const w=S().work;const tt=S().teachers[tid]||{};const vis=tt.payType==='visit';const pv=Math.round(+tt.perVisit||0);
  for(const id in w){const doc=w[id];if(doc.tid!==tid)continue;for(const dd in doc.days){const v=doc.days[dd];if(!v.m&&!v.a)continue;const x={d:doc.ym+'-'+dd,...v};if(vis){x.r=pv;x.a=pv;x.v=1}out.push(x)}}
  return out.sort((a,b)=>a.d<b.d?-1:1);
}
function lastOf(tid){
  const t=S().teachers[tid];if(t&&t.lastSettled)return t.lastSettled;
  const base=S().settings.dataUntil||todayS;const e=defaultEnd(addDays(base,-1));
  return addYm(ymOf(e),-1)+'-19';   // 첫 정산: 전달 20일 ~ 그달 19일
}
function defaultEnd(L){const[y,m,d]=P(L);const ym=y+'-'+pad(m);let e=d<19?ym+'-19':addYm(ym,1)+'-19';if((U(e)-U(L))/86400000<10)e=addYm(ymOf(e),1)+'-19';return e}
function cands(ym){const r=[];for(let d=13;d<=18;d++){const s=ym+'-'+pad(d);const g=dow(s);if(g===5||g===6)r.push(s)}return r}
function startL(tid){return UI.start?addDays(UI.start,-1):lastOf(tid)}
function rangeCalc(tid,end,extra){
  const L=startL(tid);const rows=daysOf(tid).filter(x=>x.d>L&&x.d<=end);
  const mins=rows.reduce((a,x)=>a+x.m,0), base=rows.reduce((a,x)=>a+x.a,0);
  const ex=Math.max(0,Math.round(+extra||0));const gross=base+ex;const tx=taxFor(tid,gross);
  const rates=[...new Set(rows.map(x=>x.r))];
  return{L,start:addDays(L,1),end,rows,mins,base,extra:ex,gross,...tx,net:gross-tx.tot,rates};
}

function bigCal(ym,sel){
  const st=S();const f=dow(ym+'-01'),n=daysIn(ym),cd=sel?cands(ym):[];
  const work={};if(sel)daysOf(sel.tid).forEach(x=>{if(x.d.startsWith(ym))work[x.d]=x});
  const pays={};for(const id in st.pay){const q=st.pay[id];if(!q.date.startsWith(ym))continue;const t=st.teachers[q.tid];if(!t)continue;if(sel?q.tid!==sel.tid:(t.payOnly))continue;(pays[q.date]=pays[q.date]||[]).push({...q,name:t.name})}
  const cnt={};for(const id in st.pay){const q=st.pay[id];const t=st.teachers[q.tid];if(!t||t.payOnly||(q.kind&&q.kind!=='급여'))continue;if(sel&&q.tid!==sel.tid)continue;cnt[q.date]=(cnt[q.date]||0)+1}
  const best={};Object.keys(cnt).forEach(d=>{const k=d.slice(0,7);if(!best[k]||cnt[d]>cnt[best[k]]||(cnt[d]===cnt[best[k]]&&d>best[k]))best[k]=d});
  const starts=new Set((sel?Object.keys(cnt):Object.values(best)).map(d=>addDays(d,1)));
  const exps={};if(!sel)[ym,addYm(ym,-1)].forEach(k=>((st.exp[k]||{}).items||[]).forEach(x=>{if(x.date&&x.date.startsWith(ym))(exps[x.date]=exps[x.date]||[]).push(x)}));
  let g=DW.map((x,j)=>`<div class="dw${j===0?' sun':''}">${x}</div>`).join('');
  for(let k=0;k<f;k++)g+='<div></div>';
  for(let d=1;d<=n;d++){const s=ym+'-'+pad(d);let cl='d bd',ev='';
    if(sel){if(s>sel.L&&s<=sel.end)cl+=' in';else if(s<=sel.done)cl+=' done';if(s===sel.end)cl+=' end';const w=work[s];if(w){cl+=' work';ev+=`<span class="h">${hm(w.m)}</span>`}}
    const ps=pays[s]||[];
    if(sel)ps.forEach(q=>{ev+=`<span class="ev evp" title="${esc(q.kind||'급여')} ${won(q.amount)}원">${q.kind&&q.kind!=='급여'?esc(q.kind)+' ':'송금 '}${won(q.amount)}</span>`});
    else if(ps.length){const byK={};ps.forEach(q=>{const k=q.kind||'급여';(byK[k]=byK[k]||[]).push(q)});
      for(const k in byK){const L=byK[k],tot=L.reduce((a,q)=>a+q.amount,0);ev+=`<span class="ev evp" title="${esc(L.map(q=>q.name+' '+won(q.amount)).join(', '))}">${esc(k)} ${L.length===1?esc(L[0].name):L.length+'명'}</span><span class="ev evp num">${won(tot)}</span>`}}
    (exps[s]||[]).forEach(x=>{ev+=`<span class="ev evx">${esc(x.name)} ${won(x.amount)}</span>`});
    const tg=(sel&&s===addDays(sel.L,1))?'<i class="tg st">정산 시작</i>':starts.has(s)?'<i class="tg pay">급여시작</i>':cd.includes(s)?`<i class="tg cand">${DW[dow(s)]}</i>`:'';
    const act=sel?`onclick="pickDay('${s}')"`:'tabindex="-1"';
    g+=`<button class="${cl}" ${act} aria-label="${md(s)}"><span class="n">${d}</span>${tg}${ev}</button>`}
  return `<div class="cal">${g}</div>`;
}

/* ---------- 엑셀 읽기 ---------- */
function xlDate(v){
  if(v instanceof Date) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number'&&v>20000){return fromU(Math.round((Math.floor(v)-25569)*86400000))}
  const m=String(v||'').match(/(\d{4})[-./]\s*(\d{1,2})[-./]\s*(\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):null;
}
function xlTime(v){
  if(typeof v==='number'){let mi=Math.round((v-Math.floor(v))*1440);if(mi===1440)mi=0;return pad(Math.floor(mi/60))+':'+pad(mi%60)}
  const all=String(v||'').match(/\d{1,2}:\d{2}/g);return all?all[all.length-1].padStart(5,'0'):'';
}
function xlMins(v){
  if(typeof v==='number') return Math.round(v*1440);
  const m=String(v||'').match(/(\d+)\s*[:시]\s*(\d+)/);return m?(+m[1])*60+(+m[2]):null;
}
const numOf=v=>typeof v==='number'?v:+(String(v||'').replace(/[^\d.-]/g,''))||0;
async function onFile(file){
  if(!file)return;
  if(typeof XLSX==='undefined'){toast('엑셀 도구를 불러오지 못했어요. 새로고침 해주세요');return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:'array'})}catch(e){toast('엑셀 파일을 읽지 못했어요. 가치업에서 받은 .xlsx 파일이 맞는지 확인해주세요');return}
  const recs=[],names0=new Set();
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>String(c).replace(/\s/g,'')==='날짜'));if(hi<0)continue;
    const H=rows[hi].map(c=>String(c).replace(/\s/g,''));const col=k=>H.indexOf(k);
    const cD=col('날짜'),cN=col('이름'),cI=col('출근'),cO=col('퇴근'),cW=H.findIndex(h=>h.startsWith('근무시간')),cR=col('금액'),cA=col('합계');
    for(const r of rows.slice(hi+1)){
      const d=xlDate(r[cD]);if(!d)continue;const raw=String(r[cN]||sn);const name=cleanName(raw);if(!name)continue;
      const i=xlTime(r[cI]),o=xlTime(r[cO]);let m=cW>=0?xlMins(r[cW]):null;
      if(m==null&&i&&o){m=((+o.slice(0,2))*60+(+o.slice(3)))-((+i.slice(0,2))*60+(+i.slice(3)));if(m<0)m+=1440}
      const rate=cR>=0?numOf(r[cR]):0;let a=cA>=0?numOf(r[cA]):0;if(!a&&rate&&m)a=Math.floor(m*rate/60);
      names0.add(name+(raw.includes('퇴사')?'|R':''));
      if(!i&&!o&&!m&&!a)continue; // 일하지 않은 날(빈 줄)은 건너뜀
      recs.push({d,name,ret:raw.includes('퇴사'),i,o,m:m||0,r:rate,a});
    }
  }
  const st=S();
  for(const k of names0){const[n,f]=k.split('|');const tid=tidOf(n);const t=st.teachers[tid];
    if(!t) await put('teachers/'+tid,{name:n,birth:'',lastSettled:'',retired:!!f});
    else if(f&&!t.retired) await put('teachers/'+tid,{...t,retired:true});}
  if(!recs.length){render();toast(names0.size?'이 파일 기간에는 근무한 날이 없어요':'근무 기록을 찾지 못했어요. 가치업 “근무기록 조회” 엑셀인지 확인해주세요');return}
  let nNew=0,nSame=0,nChg=0;const byDoc={};const names=new Set();
  for(const x of recs){
    const tid=tidOf(x.name);names.add(x.name);
    const id=tid+'__'+ymOf(x.d);byDoc[id]=byDoc[id]||{tid,ym:ymOf(x.d),days:{...((st.work[id]||{}).days||{})}};
    const dd=x.d.slice(8);const old=byDoc[id].days[dd];const nv={i:x.i,o:x.o,m:x.m,r:x.r,a:x.a};
    if(!old)nNew++;else if(JSON.stringify(old)===JSON.stringify(nv))nSame++;else nChg++;
    byDoc[id].days[dd]=nv;
  }
  for(const id in byDoc) await put('work/'+id,byDoc[id]);
  const maxD=recs.reduce((a,x)=>x.d>a?x.d:a,'');
  if(!st.settings.dataUntil||maxD>st.settings.dataUntil) await put('config/settings',{...st.settings,dataUntil:maxD});
  UI.end=null;UI.view=null;render();
  toast(`${names.size}명 근무 ${recs.length}일을 읽었어요 · 새로 ${nNew}일${nSame?', 이미 있던 '+nSame+'일':''}${nChg?', 바뀐 '+nChg+'일':''}`);
}

/* ---------- 연간 기록 ---------- */
function periodOf(y,mi,mode){const ym=y+'-'+pad(mi+1);
  if(mode==='m')return{s:ym+'-01',e:ym+'-'+pad(daysIn(ym)),label:(mi+1)+'월',sub:''};
  const pv=addYm(ym,-1);return{s:pv+'-20',e:ym+'-19',label:(mi+1)+'월분',sub:+pv.slice(5)+'/20~'+(mi+1)+'/19'};}
function yearData(y,mode){
  const st=S();const P12=[...Array(12)].map((_,i)=>periodOf(y,i,mode));
  const rows=[];
  for(const tid in st.teachers){const t=st.teachers[tid];const ds=daysOf(tid);
    const cells=P12.map(p=>{const w=ds.filter(x=>x.d>=p.s&&x.d<=p.e);const a=w.reduce((q,x)=>q+x.a,0),m=w.reduce((q,x)=>q+x.m,0);
      const open=w.some(x=>x.d>(t.lastSettled||''));return{n:w.length,a,m,open,days:w}});
    if(!cells.some(c=>c.n))continue;
    const lastD=ds.filter(x=>x.d<=P12[11].e).slice(-1)[0];
    rows.push({tid,name:t.name,ret:!!t.retired,cells,tot:cells.reduce((q,c)=>q+c.a,0),mins:cells.reduce((q,c)=>q+c.m,0),lastD:lastD&&lastD.d});}
  rows.sort((a,b)=>(a.ret?1:0)-(b.ret?1:0)||a.name.localeCompare(b.name,'ko'));
  return{P12,rows};
}

  if(pays.length){const nx=addYm(ym,1);h+=`<tr><td><span class="pill cat">인건비</span></td><td>원천세 3.3% 납부 <span class="sub">(${+nx.slice(5)}월 10일까지 홈택스)</span></td><td class="r num">${won(pTax)}</td><td class="num">${+nx.slice(5)}/10</td><td><span class="pill warn">납부 예정</span></td><td></td></tr>`}
  items.slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:1).forEach(x=>{
    h+=`<tr><td><span class="pill cat">${esc(x.cat)}</span></td><td>${esc(x.name)}${x.fid?' <span class="sub">매달</span>':''}${x.src?' <span class="sub">통장</span>':''}</td><td class="r num">${won(x.amount)}</td><td class="num">${x.date?md(x.date):''}</td>
    <td><button class="ghost" style="padding:2px 4px" onclick="togglePaid('${x.id}')"><span class="pill ${x.paid?'ok':'warn'}">${x.paid?'완료':'미완료'}</span></button></td>
    <td class="r">${UI.confirm===x.id?`<button class="danger" onclick="delItem('${x.id}')">삭제</button>`:`<button class="ghost" aria-label="삭제" onclick="UI.confirm='${x.id}';render()">✕</button>`}</td></tr>`});
  if(!pays.length&&!pRows.length&&!items.length) h+=`<tr><td colspan="6" class="sub" style="text-align:center;padding:24px">이 달에 적힌 비용이 없어요. 아래에서 월세, 관리비 같은 비용을 넣어보세요.</td></tr>`;
  h+=`</tbody></table></div>
  <div style="margin-top:14px" class="form">
    <input id="fName" placeholder="항목 (예: 월세)">
    <select id="fCat"><option>고정비</option><option>변동비</option><option>기타</option></select>
    <input id="fAmt" type="number" inputmode="numeric" placeholder="금액">
    <input id="fDate" type="date" value="${ym}-${pad(Math.min(+todayS.slice(8),daysIn(ym)))}">
    <label class="chk"><input type="checkbox" id="fFix"> 매달 고정</label>
    <button class="pri" onclick="addItem()">비용 넣기</button>
  </div><p class="sub" style="margin:8px 0 0">인건비는 급여 통장 송금 기록이 보낸 날 기준으로 들어와요. 김용기 님에게 보낸 월세(935,000원)·관리비(150,000원)·전기세(나머지)는 “송금 기록 올리기” 때 자동으로 들어와요.</p></div>`;
  if(fixed.length) h+=`<div class="card" style="margin-top:16px"><h2 style="margin-bottom:8px">매달 고정비</h2><div class="hist">${fixed.map(f=>`<div class="it"><span class="pill cat">${esc(f.cat)}</span><span>${esc(f.name)}</span><span class="sub">매달 ${f.day}일</span><span class="sp"></span><span class="num">${won(f.amount)}원</span>${UI.confirm==='F'+f.id?`<button class="danger" onclick="delFixed('${f.id}')">고정 해제</button>`:`<button class="ghost" onclick="UI.confirm='F${f.id}';render()">고정 해제</button>`}</div>`).join('')}</div></div>`;
  return h;
}
const rid=()=>Math.random().toString(36).slice(2,9);
async function saveMonth(items){await put('expenses/'+UI.ledYm,{ym:UI.ledYm,items})}
async function addItem(){
  const name=$('#fName').value.trim(),cat=$('#fCat').value,amount=Math.round(+$('#fAmt').value||0),date=$('#fDate').value;
  if(!name){toast('항목 이름을 적어주세요');$('#fName').focus();return}
  if(!amount){toast('금액을 적어주세요');$('#fAmt').focus();return}
  const items=[...((S().exp[UI.ledYm]||{}).items||[])];const it={id:rid(),name,cat,amount,date,paid:false};
  if($('#fFix').checked){const f={id:rid(),name,cat,amount,day:+(date||'x-x-1').slice(8)||1};it.fid=f.id;await put('config/fixed',{items:[...(S().fixed.items||[]),f]})}
  items.push(it);await saveMonth(items);render();toast(name+' 넣었어요');
}
async function addFixed(){
  const items=[...((S().exp[UI.ledYm]||{}).items||[])];const n=daysIn(UI.ledYm);
  (S().fixed.items||[]).forEach(f=>{if(!items.some(x=>x.fid===f.id))items.push({id:rid(),fid:f.id,name:f.name,cat:f.cat,amount:f.amount,date:UI.ledYm+'-'+pad(Math.min(f.day,n)),paid:false})});
  await saveMonth(items);render();
}
async function togglePaid(id){const items=((S().exp[UI.ledYm]||{}).items||[]).map(x=>x.id===id?{...x,paid:!x.paid}:x);await saveMonth(items);render()}
async function delItem(id){const items=((S().exp[UI.ledYm]||{}).items||[]).filter(x=>x.id!==id);UI.confirm=null;await saveMonth(items);render()}
async function delFixed(id){await put('config/fixed',{items:(S().fixed.items||[]).filter(f=>f.id!==id)});UI.confirm=null;render();toast('다음 달부터 자동으로 넣지 않아요')}

/* ---------- 선생님 정보 ---------- */
function renderTeachers(){
  const ts=Object.entries(S().teachers).map(([id,t])=>({id,...t})).sort((a,b)=>(a.retired?1:0)-(b.retired?1:0)||a.name.localeCompare(b.name,'ko'));
  let h=`<div class="head"><h1>선생님 정보</h1><span class="sp"></span>${uploadBtn()}</div>`;
  if(!ts.length) return h+`<div class="card empty"><p>가치업 엑셀을 올리면 선생님이 자동으로 추가돼요.</p></div>`;
  h+=`<div class="card"><div class="scroll"><table class="t"><thead><tr><th>이름</th><th>생년월일 (명세서에 들어가요)</th><th>지난 정산일</th><th>계산 방식</th><th>3.3% 떼기</th><th>퇴사</th></tr></thead><tbody>`;
  ts.forEach(t=>{const ds=daysOf(t.id);const last=ds[ds.length-1];
    if(t.payOnly){h+=`<tr><td><b>${esc(t.name)}</b> <span class="rtag">송금만</span></td><td colspan="3" class="sub">가치업 기록 없이 송금만 기록해요</td><td></td><td><input type="checkbox" id="r_${t.id}" ${t.retired?'checked':''} onchange="updT('${t.id}','retired',this.checked)" aria-label="퇴사"></td></tr>`;return}
    h+=`<tr><td><b>${esc(t.name)}</b></td><td><input id="b_${t.id}" value="${esc(t.birth||'')}" placeholder="1999-01-01" style="width:130px" onchange="updT('${t.id}','birth',this.value.trim())"></td>
    <td><input type="date" id="l_${t.id}" value="${t.lastSettled||''}" onchange="updT('${t.id}','lastSettled',this.value)"></td>
    <td><select id="pt_${t.id}" onchange="updT('${t.id}','payType',this.value)"><option value="hourly" ${t.payType!=='visit'?'selected':''}>시급 (가치업 금액${last&&t.payType!=='visit'?' · '+won(last.r)+'원':''})</option><option value="visit" ${t.payType==='visit'?'selected':''}>1회당 금액</option></select>${t.payType==='visit'?` <input id="pv_${t.id}" type="number" inputmode="numeric" value="${t.perVisit||''}" placeholder="10500" style="width:90px" onchange="updT('${t.id}','perVisit',Math.round(+this.value||0))"> 원`:''}</td>
    <td><input type="checkbox" id="nt_${t.id}" ${t.noTax?'':'checked'} onchange="updT('${t.id}','noTax',!this.checked)" aria-label="3.3% 떼기"></td><td><input type="checkbox" id="r_${t.id}" ${t.retired?'checked':''} onchange="updT('${t.id}','retired',this.checked)" aria-label="퇴사"></td></tr>`});
  h+=`</tbody></table></div><p class="sub" style="margin:10px 0 0">퇴사를 체크하면 급여 정산 화면에서 숨겨져요. 기록은 그대로 남아요.</p></div>`;
  h+=`<div class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">가치업에 없는 사람 추가</h2><p class="sub" style="margin:0 0 10px">출퇴근 기록 없이 송금만 하는 사람이에요. 추가하면 “송금 기록 올리기” 때 이 이름이 들어간 송금도 연간 기록 → 실제 송금에 들어가요.</p><div class="row"><input id="poName" placeholder="이름 (예: 홍길동)" style="width:180px"><button class="pri" onclick="addPayee()">추가</button></div></div>`;
  return h;
}
async function addPayee(){const n=cleanName($('#poName').value);if(!n){toast('이름을 적어주세요');return}const id=tidOf(n);if(S().teachers[id]){toast('이미 있는 이름이에요');return}await put('teachers/'+id,{name:n,birth:'',lastSettled:'',retired:false,payOnly:true});render();toast(n+' 님을 추가했어요. 송금 기록을 다시 올리면 들어가요')}
async function updT(id,k,v){const t=S().teachers[id];await put('teachers/'+id,{...t,[k]:v});render();toast('저장했어요')}

  <div class="card stack"><h2>자료 불러오기</h2><div class="row"><label class="btn" tabindex="0"><input type="file" accept=".json" hidden onchange="importBackup(this.files[0]);this.value=''">백업 파일(.json) 불러오기</label><span class="sub">내려받은 백업 파일의 자료를 그대로 넣어요. 같은 자료는 덮어써요.</span></div></div>
  <div class="card stack"><h2>자료 백업</h2><div class="row"><button onclick="backup()">모든 자료 내려받기 (.json)</button><span class="sub">선생님, 근무 기록, 정산, 장부를 파일 하나로 저장해요</span></div></div>
  </div>`;
}
async function setS(k,v){await put('config/settings',{...S().settings,[k]:v});render();toast('저장했어요')}
async function backup(){
  const data=JSON.stringify(S(),null,1);
  if(!dl){toast('이 화면에서는 파일 저장이 안 돼요');return}
  try{await dl.save({filename:'델타급여장부_백업_'+todayS+'.json',data});toast('저장했어요')}catch(e){if(e.code!=='declined')toast('저장하지 못했어요')}
}

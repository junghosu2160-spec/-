<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등부 출결 관리 · 델타수학 전문학원</title>
<style>
  :root{
    --color-bg:#F5F6FA;
    --color-surface:#FFFFFF;
    --color-surface-alt:#EEF1F7;
    --color-border:#E3E6ED;
    --color-primary:#161616;
    --color-accent:#FFC531;
    --color-accent-dark:#E6A800;
    --color-text:#1F2937;
    --color-text-muted:#6B7280;
    --color-success:#2E9E6C;
    --color-success-soft:#E4F5EC;
    --color-warning:#C98A2E;
    --color-warning-soft:#FBF0DE;
    --color-danger:#D64550;
    --color-danger-soft:#FBE7E8;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;background:var(--color-primary);border-radius:var(--radius-lg);color:#fff;margin-bottom:16px;
  }
  .header-brand{display:flex;align-items:center;gap:10px;}
  .header-mark{width:26px;height:39px;flex-shrink:0;}
  .header-title{font-size:15px;font-weight:800;}
  .header-sub{font-size:11px;color:var(--color-accent);font-weight:600;margin-top:2px;}
  .header-right{text-align:right;}
  .header-date{font-size:12.5px;font-weight:700;}
  .header-sync{font-size:10.5px;margin-top:2px;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px;text-align:center;}
  .stat-card .label{font-size:11px;color:var(--color-text-muted);font-weight:700;}
  .stat-card .value{font-size:22px;font-weight:800;margin-top:4px;}
  .stat-card .value.success{color:var(--color-success);}
  .stat-card .value.muted{color:var(--color-text-muted);}

  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;}
  .card-title{font-size:13.5px;font-weight:800;margin:0 0 10px 0;display:flex;align-items:center;justify-content:space-between;}
  .search-input{
    width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
    font-size:13.5px;outline:none;
  }
  .search-input:focus{border-color:var(--color-accent-dark);box-shadow:0 0 0 3px rgba(255,197,49,0.18);}

  .stu-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:8px;
    background:var(--color-surface);
  }
  .stu-row.checked-in{border-color:var(--color-success);background:var(--color-success-soft);}
  .stu-row.checked-out{opacity:0.6;}
  .stu-row.absent{border-color:var(--color-danger);background:var(--color-danger-soft);}
  .stu-name{flex:1 1 130px;display:flex;align-items:center;gap:8px;}
  .stu-name strong{font-size:14px;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--color-surface-alt);color:var(--color-text-muted);}
  .time-box{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--color-text-muted);}
  .time-box input[type=time]{border:1px solid var(--color-border);border-radius:5px;padding:2px 4px;font-size:11px;width:64px;}
  .btn{
    padding:8px 14px;border-radius:8px;border:1px solid transparent;font-size:12.5px;font-weight:700;
    cursor:pointer;transition:filter .12s ease;
  }
  .btn:active{filter:brightness(0.94);}
  .btn-primary{background:var(--color-primary);color:#fff;}
  .btn-success{background:var(--color-success);color:#fff;}
  .btn-danger-outline{background:#fff;color:var(--color-danger);border-color:var(--color-danger-soft);}
  .btn-ghost{background:#fff;color:var(--color-text);border-color:var(--color-border);}
  .status-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .status-tag.대기{background:var(--color-surface-alt);color:var(--color-text-muted);}
  .status-tag.등원{background:var(--color-success-soft);color:var(--color-success);}
  .status-tag.지각{background:var(--color-warning-soft);color:var(--color-warning);}
  .status-tag.결석{background:var(--color-danger-soft);color:var(--color-danger);}
  .status-tag.하원{background:var(--color-surface-alt);color:var(--color-text-muted);}

  .empty-msg{color:var(--color-text-muted);font-size:13px;text-align:center;padding:24px;}
  .hint{font-size:11px;color:var(--color-text-muted);margin-top:10px;line-height:1.6;}
  .director-note-banner{
    background:#FFF6DC;border:1px solid var(--color-accent-dark);border-radius:var(--radius-md);
    padding:12px 14px;margin-bottom:16px;
  }
  .director-note-banner .label{font-size:11px;font-weight:800;color:var(--color-accent-dark);margin-bottom:4px;}
  .director-note-banner .text{font-size:13.5px;color:#4A3A00;line-height:1.5;}
  .memo-pin{
    font-size:11.5px;font-weight:700;color:var(--color-accent-dark);
    background:#FFF6DC;padding:5px 10px;border-radius:8px;
  }
  .daily-note-textarea{
    width:100%;min-height:80px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
    font-size:13.5px;line-height:1.6;resize:vertical;font-family:inherit;
  }
  .daily-note-saved{font-size:11px;color:var(--color-success);margin-top:6px;display:none;}
  /* ===== 출근 달력 ===== */
  .work-cal-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:16px;margin-bottom:14px;}
  .work-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .work-cal-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .work-cal-nav{display:flex;align-items:center;gap:6px;}
  .work-cal-nav button{background:none;border:1px solid var(--color-border);border-radius:6px;padding:3px 9px;font-size:14px;cursor:pointer;color:var(--color-text);}
  .work-cal-month{font-size:13px;font-weight:700;min-width:60px;text-align:center;color:var(--color-text-muted);}
  .work-cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;}
  .work-cal-weekdays span{text-align:center;font-size:10px;font-weight:700;padding:2px 0;color:var(--color-text-muted);}
  .work-cal-weekdays span.sun{color:#D64550;}
  .work-cal-weekdays span.sat{color:#378ADD;}
  .work-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .wc-day{min-height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--color-text-muted);}
  .wc-day.work{background:#EAF3DE;color:#27500A;font-weight:800;}
  .wc-day.today-ring{outline:2px solid #2E9E6C;outline-offset:-2px;}
  .wc-day.sun-num{color:#D64550;}
  .wc-day.sat-num{color:#378ADD;}
  .work-cal-legend{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .work-cal-legend .dot{width:10px;height:10px;border-radius:3px;background:#EAF3DE;border:1px solid #C0DD97;flex-shrink:0;}
  .work-cal-legend span{font-size:11px;color:var(--color-text-muted);}
  .elem-mk-count{font-size:11px;color:var(--color-text-muted);font-weight:700;margin-bottom:8px;}
  .elem-mk-row{border:1px solid var(--color-border);border-radius:10px;margin-bottom:6px;overflow:hidden;background:var(--color-surface);}
  .elem-mk-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:var(--color-surface-alt);}
  .elem-mk-name{font-weight:800;font-size:13px;}
  .elem-mk-grade{font-size:11px;color:var(--color-text-muted);}
  .elem-mk-remain{margin-left:auto;font-size:11px;font-weight:700;background:#FEF2E9;color:#BA7517;padding:2px 9px;border-radius:12px;}
  .elem-mk-head i{font-size:14px;color:var(--color-text-muted);}
  .elem-mk-body{padding:12px;border-top:1px solid var(--color-border);}
  .elem-mk-sub{font-size:11.5px;color:var(--color-text-muted);margin-bottom:10px;}
  .elem-mk-progress-box{background:var(--color-surface-alt);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .elem-mk-bar{height:5px;background:var(--color-surface);border-radius:99px;overflow:hidden;margin-bottom:4px;}
  .elem-mk-bar-fill{height:100%;background:#5DCAA5;border-radius:99px;}
  .elem-mk-progress-txt{font-size:11px;color:var(--color-text-muted);}
  .elem-mk-progress-txt b{color:var(--color-text);}
  .elem-mk-add-box{background:#EAF4FF;border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .elem-mk-deduct-box{background:#FBEAF0;border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .elem-mk-sec-label{font-size:11px;font-weight:800;margin-bottom:6px;}
  .elem-mk-sec-label.add{color:#1A5FA8;}
  .elem-mk-sec-label.deduct{color:#993556;}
  .elem-mk-btn-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .elem-mk-btn{padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid transparent;background:#fff;}
  .elem-mk-btn.add{border-color:#BFE0FB;color:#1A5FA8;}
  .elem-mk-btn.deduct{border-color:#F4C0D1;color:#993556;}
  .elem-mk-btn.deduct-done{border-color:#9FE1CB;background:#E1F5EE;color:#085041;}
  .elem-mk-btn.apply{background:#161616;color:#fff;margin-left:auto;}
  .elem-mk-input{width:42px;border:1px solid var(--color-border);border-radius:5px;padding:3px 4px;font-size:12.5px;font-weight:800;text-align:center;background:#fff;}
  .elem-mk-dismiss{text-align:right;margin-bottom:10px;}
  .elem-mk-dismiss span{font-size:10.5px;color:var(--color-text-muted);cursor:pointer;text-decoration:underline;}
  .elem-mk-chat{display:flex;flex-direction:column;gap:6px;background:var(--color-surface-alt);border-radius:8px;padding:8px 10px;margin-bottom:8px;max-height:160px;overflow-y:auto;}
  .elem-mk-chat-empty{font-size:11.5px;color:var(--color-text-muted);text-align:center;padding:6px 0;}
  .elem-mk-bubble{font-size:12px;padding:6px 10px;border-radius:8px;max-width:80%;line-height:1.4;}
  .elem-mk-bubble.parent{align-self:flex-start;background:#fff;border:1px solid var(--color-border);}
  .elem-mk-bubble.staff{align-self:flex-end;background:var(--color-primary);color:#fff;}
  .elem-mk-reply-row{display:flex;gap:6px;}
  .elem-mk-reply-input{flex:1;padding:7px 10px;border:1px solid var(--color-border);border-radius:8px;font-size:12.5px;}
  /* ===== 한 달 멘트 · 핸드폰 기준 ===== */
  .pgtab{display:flex;gap:6px;background:var(--color-surface-alt);border-radius:11px;padding:3px;margin-bottom:13px;}
  .pgtab-b{flex:1;font:inherit;font-size:14px;font-weight:800;border:0;background:none;padding:11px 8px;
    border-radius:9px;cursor:pointer;color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;gap:6px;}
  .pgtab-b.on{background:var(--color-surface);color:var(--color-text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .pgtab-n{font-size:10.5px;font-weight:800;background:var(--color-danger);color:#fff;border-radius:999px;padding:1px 7px;}
  .mc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .mc-mon{font-size:15px;font-weight:800;min-width:104px;text-align:center;}
  .mc-prog{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:150px;}
  .mc-prog-t{font-size:12px;color:var(--color-text-muted);white-space:nowrap;}
  .mc-bar{height:7px;border-radius:99px;background:var(--color-neutral-soft);overflow:hidden;flex:1;min-width:70px;}
  .mc-bar i{display:block;height:100%;background:var(--color-success);transition:width .25s;}
  .mc-filters{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
  .mc-list{max-height:280px;overflow:auto;border:1px solid var(--color-border);border-radius:12px;}
  .mc-row{display:flex;align-items:center;gap:9px;padding:12px;border-bottom:1px solid var(--color-border);cursor:pointer;}
  .mc-row:last-child{border-bottom:0;}
  .mc-row.on{background:var(--color-primary-soft);box-shadow:inset 3px 0 0 var(--color-accent-dark);}
  .mc-nm{font-size:14.5px;font-weight:700;min-width:0;}
  .mc-by{font-size:11px;color:var(--color-text-muted);font-weight:600;margin-top:1px;}
  .mc-st{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .mc-st.no{background:var(--color-neutral-soft);color:var(--color-text-muted);}
  .mc-st.dr{background:var(--color-neutral-soft);color:var(--color-text);}
  .mc-st.wr{background:var(--color-warning-soft);color:var(--color-warning);}
  .mc-st.ok{background:var(--color-success-soft);color:var(--color-success);}
  .mc-empty{padding:18px;font-size:13px;color:var(--color-text-muted);text-align:center;}
  .mc-empty.big{padding:46px 16px;}
  .mc-note{background:var(--color-warning-soft);border:1px solid #f0d9a8;border-radius:10px;
    padding:11px 13px;font-size:13px;line-height:1.6;color:#7a5510;margin-bottom:12px;}
  .mc-note.ok{background:var(--color-success-soft);border-color:#b6e3cb;color:#17603f;}
  .mc-pane-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
  .mc-pane-nm{font-size:18px;font-weight:800;}
  .mc-pane-sub{font-size:12px;color:var(--color-text-muted);}
  .mc-cat{border:1px solid var(--color-border);border-radius:11px;margin-bottom:8px;background:#FCFCFE;overflow:hidden;}
  .mc-cat-h{display:flex;align-items:center;gap:8px;padding:13px;cursor:pointer;}
  .mc-cat-t{font-size:13.5px;font-weight:800;}
  .mc-cat-n{font-size:11px;font-weight:800;background:var(--color-accent);color:#3a2c00;border-radius:999px;padding:2px 8px;}
  .mc-cat-x{margin-left:auto;font-size:12px;color:var(--color-text-muted);}
  .mc-sub{padding:0 12px 11px;}
  .mc-tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;margin-bottom:7px;}
  .mc-tag.g{background:var(--color-success-soft);color:var(--color-success);}
  .mc-tag.b{background:var(--color-warning-soft);color:var(--color-warning);}
  .mc-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .mc-chip{font:inherit;font-size:13.5px;font-weight:700;padding:8px 13px;min-height:36px;border-radius:999px;
    border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);cursor:pointer;}
  .mc-chip:disabled{opacity:.5;}
  .mc-chip.on.g{background:var(--color-success-soft);border-color:var(--color-success);color:var(--color-success);}
  .mc-chip.on.b{background:var(--color-warning-soft);border-color:var(--color-warning);color:var(--color-warning);}
  .mc-chip.add{border-style:dashed;color:var(--color-text-muted);}
  .mc-tidy{display:flex;align-items:center;gap:8px;margin:12px 0 4px;}
  .mc-tidy-b{font:inherit;font-size:11.5px;font-weight:800;border:1px solid var(--color-border);
    background:var(--color-surface);color:var(--color-text-muted);border-radius:999px;padding:5px 12px;cursor:pointer;}
  .mc-tidy-b.on{background:var(--color-danger,#dc2626);border-color:var(--color-danger,#dc2626);color:#fff;}
  .mc-tidy-t{font-size:11.5px;color:var(--color-text-muted);}
  .mc-chip.del{border-color:#f0a8a8;background:#fff5f5;color:#b91c1c;}
  .mc-chip.del:hover{background:#fee2e2;}
  .mc-sec{margin-top:15px;}
  .mc-sec-t{font-size:13px;font-weight:800;color:var(--color-text-muted);margin-bottom:7px;}
  .mc-opt{font-size:11px;background:var(--color-neutral-soft);color:var(--color-text-muted);border-radius:99px;padding:2px 8px;margin-left:5px;}
  /* 글상자 — 아이폰에서 눌러도 화면이 확대되지 않도록 16px 아래로 내리지 않음 */
  .mc-sec textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;line-height:1.95;
    border:1px solid var(--color-border);border-radius:11px;padding:12px;resize:vertical;
    background:var(--color-surface);color:var(--color-text);min-height:96px;}
  .mc-sec textarea.mc-big{min-height:230px;}
  .mc-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center;}
  .mc-foot .btn{flex:1 1 auto;min-width:120px;padding:12px 10px;font-size:14px;}
  .mc-lock{flex-basis:100%;font-size:12px;color:var(--color-text-muted);}
  @media (min-width:760px){
    .mc-list{max-height:420px;}
    .mc-foot .btn{flex:0 0 auto;min-width:0;padding:8px 14px;}
    .mc-lock{flex-basis:auto;}
    .mc-sec textarea{font-size:15px;}
  }

  .mc-g{font-size:11px;font-weight:800;padding:2px 8px;border-radius:9px;flex:0 0 auto;}
  .mc-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
    background:#161616;color:#fff;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:11px;
    opacity:0;pointer-events:none;transition:.2s;z-index:9999;max-width:90vw;text-align:center;}
  .mc-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 한 달 멘트 · 저절로 불러온 출결/성적 */
  .mc-auto{border:1px solid var(--color-border);border-radius:12px;background:#FCFCFE;padding:12px 13px;margin-bottom:10px;}
  .mc-auto-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:4px;flex-wrap:wrap;}
  .mc-auto-h .auto{font-size:10.5px;font-weight:800;background:var(--color-neutral-soft);
    color:var(--color-text-muted);border-radius:99px;padding:2px 8px;}
  .mc-base{font-size:11.5px;color:var(--color-text-muted);font-weight:700;margin-bottom:9px;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .mc-base input{width:52px;text-align:center;font:inherit;font-size:13px;font-weight:800;
    border:1px solid var(--color-border);border-radius:7px;padding:4px 5px;}
  .mc-nums{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
  .mc-num{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;
    border:1px solid var(--color-border);border-radius:10px;padding:7px 9px;background:var(--color-surface);}
  .mc-num b{font-size:17px;font-variant-numeric:tabular-nums;}
  .mc-num span{font-size:10.5px;color:var(--color-text-muted);font-weight:700;}
  .mc-num.base{background:var(--color-surface-alt);}
  .mc-num.ok b{color:var(--color-success);} .mc-num.late b{color:var(--color-warning);}
  .mc-num.bad b{color:var(--color-danger);} .mc-num.mk b{color:#4338ca;}
  .mc-sw{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .mc-sw input{width:19px;height:19px;}
  .mc-pv{margin-top:8px;font-size:12.5px;line-height:1.8;background:var(--color-surface);
    border:1px dashed var(--color-border);border-radius:9px;padding:9px 11px;}
  .sc-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--color-border);
    border-radius:10px;background:var(--color-surface);margin-bottom:5px;font-size:12.5px;}
  .sc-row .sub{font-weight:800;min-width:56px;}
  .sc-row .pt{font-weight:800;font-variant-numeric:tabular-nums;}
  .sc-row .up{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--color-success);}
  .sc-row .dn{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--color-danger);}
  .sc-row .fl{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--color-text-muted);}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-brand">
      <div class="header-mark">

const WEEKDAYS = ['월','화','수','목','금','토','일'];
const JS_DAY_TO_LABEL = ['일','월','화','수','목','금','토'];

let attendance = [];
let wcTeachers = [];
let wcExceptions = [];
let elemMakeupProgress = [];
let parentMessages = [];
let elemPendingAdjust = {};

/* ===== 출근 달력 ===== */
let workCalYear = new Date().getFullYear();
let workCalMonth = new Date().getMonth();
const WC_WEEKDAYS_LABEL = ['일','월','화','수','목','금','토'];
const WC_DAY_NAMES = ['일','월','화','수','목','금','토'];

function shiftWorkCal(delta){
  workCalMonth += delta;
  if(workCalMonth < 0){ workCalMonth = 11; workCalYear--; }
  if(workCalMonth > 11){ workCalMonth = 0; workCalYear++; }
  renderWorkCal();
}

// 초등부 선생님(장자엽 선생님 — teachers 컬렉션에서 name에 '장자엽' 포함된 첫 번째)
function getElementaryTeacher(){
  return wcTeachers.find(t => (t.name||'').includes('장자엽')) || null;
}

function isWcTeacherWorking(teacher, dateStr){
  const exc = wcExceptions.find(e => e.teacherId === teacher.id && e.date === dateStr);
  if(exc) return exc.status === 'on';
  const d = new Date(dateStr + 'T00:00:00');
  const label = WC_DAY_NAMES[d.getDay()];
  return (teacher.days || []).includes(label);
}

function renderWorkCal(){
  const label = document.getElementById('workCalMonthLabel');
  const grid = document.getElementById('workCalGrid');
  const cardEl = document.querySelector('.work-cal-card');
  if(!label || !grid) return;

  label.textContent = `${workCalYear}년 ${workCalMonth + 1}월`;

  const teacher = getElementaryTeacher();

  // 안내 메시지 표시/숨김
  let noticeEl = document.getElementById('workCalNotice');
  if(!noticeEl){
    noticeEl = document.createElement('div');
    noticeEl.id = 'workCalNotice';
    noticeEl.style.cssText = 'font-size:12px;color:var(--color-warning);background:var(--color-warning-soft);border-radius:8px;padding:8px 11px;margin-bottom:10px;';
    grid.parentNode.insertBefore(noticeEl, grid);
  }
  if(!teacher){
    noticeEl.style.display = 'block';
    noticeEl.textContent = '⚠️ "장자엽" 이름의 선생님을 찾을 수 없어요. 원장님 프로그램의 [직원 관리] 탭에서 선생님을 등록해 주세요 (이름에 "장자엽"이 포함되어야 자동으로 연결돼요).';
  }else{
    noticeEl.style.display = 'none';
  }

  const todayStr2 = (() => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  })();

  const firstDay = new Date(workCalYear, workCalMonth, 1).getDay();
  const daysInMonth = new Date(workCalYear, workCalMonth + 1, 0).getDate();

  let html = '';
  let workCount = 0;
  for(let i = 0; i < firstDay; i++) html += `<div class="wc-day"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${workCalYear}-${String(workCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const isToday = dateStr === todayStr2;
    const working = teacher ? isWcTeacherWorking(teacher, dateStr) : false;
    if(working) workCount++;
    let cls = 'wc-day';
    if(working) cls += ' work';
    else if(dow === 0) cls += ' sun-num';
    else if(dow === 6) cls += ' sat-num';
    if(isToday) cls += ' today-ring';
    html += `<div class="${cls}">${d}</div>`;
  }
  grid.innerHTML = html;

  // 선생님은 찾았는데 이번 달 출근일이 0일인 경우 안내
  if(teacher && workCount === 0){
    noticeEl.style.display = 'block';
    noticeEl.textContent = `⚠️ ${teacher.name} 선생님의 ${workCalMonth+1}월 출근일이 아직 설정되지 않았어요. 원장님 프로그램 [직원 관리] 탭에서 기본 출근 요일을 체크해 주세요.`;
  }
}

  if(!snapVal) return [];
  return Object.entries(snapVal).map(([id, v]) => ({ id, ...v }));
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowTimeStr(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function weekdayLabelOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return JS_DAY_TO_LABEL[d.getDay()];
}
function getDayTime(student, dayLabel){
  return (student.schedule && student.schedule[dayLabel]) || null;
}
function getDayDuration(student, dayLabel){
  return (student.scheduleDuration && student.scheduleDuration[dayLabel]) || 60;
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function getTodayRecord(studentId){
  const date = todayStr();
  return attendance.find(a => a.studentId === studentId && a.date === date);
}
function isElementary(student){
  return (student.grade || '').startsWith('초');
}

function tickDate(){
  const d = new Date();
  document.getElementById('todayDate').textContent = d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}
tickDate();
setInterval(() => { tickDate(); if(!document.getElementById('searchInput').value.trim()) renderList(); }, 1000 * 30);

function checkIn(studentId){
  const stu = students.find(s => s.id === studentId);
  if(!stu) return;
  const rec = getTodayRecord(studentId);

  // 이미 등원 체크된 상태에서 다시 누르면 취소 (하원 기록도 같이 지움)
  if(rec && rec.checkInTime){
    db.ref('attendance/' + rec.id).update({ checkInTime: '', checkOutTime: '', status: '' });
    return;
  }

  const date = todayStr();
  const time = nowTimeStr();
  const weekday = weekdayLabelOf(date);
  const scheduled = getDayTime(stu, weekday);
  const status = (!scheduled || time <= scheduled) ? '출석' : '지각';
  if(rec){
    db.ref('attendance/' + rec.id).update({ status, checkInTime: time });
  }else{
    db.ref('attendance').push({ studentId, date, status, checkInTime: time, checkOutTime:'', memo:'' });
  }
}

function checkOut(studentId){
  const rec = getTodayRecord(studentId);
  if(!rec) return;

  // 이미 하원 체크된 상태에서 다시 누르면 취소
  if(rec.checkOutTime){
    db.ref('attendance/' + rec.id).update({ checkOutTime: '' });
    return;
  }

  const time = nowTimeStr();
  db.ref('attendance/' + rec.id).update({ checkOutTime: time });
}

function markAbsent(studentId){
  const rec = getTodayRecord(studentId);

  // 이미 결석 상태에서 다시 누르면 취소 (대기중으로)
  if(rec && rec.status === '결석'){
    db.ref('attendance/' + rec.id).update({ status: '', checkInTime: '', checkOutTime: '' });
    return;
  }

  if(rec){
    db.ref('attendance/' + rec.id).update({ status:'결석', checkInTime:'', checkOutTime:'' });
  }else{
    db.ref('attendance').push({ studentId, date: todayStr(), status:'결석', checkInTime:'', checkOutTime:'', memo:'' });
  }
}

function editCheckInTime(studentId, value){
  if(!value) return;
  const rec = getTodayRecord(studentId);
  if(rec){
    db.ref('attendance/' + rec.id).update({ checkInTime: value });
  }else{
    db.ref('attendance').push({ studentId, date: todayStr(), status:'출석', checkInTime: value, checkOutTime:'', memo:'' });
  }
}
function editCheckOutTime(studentId, value){
  if(!value) return;
  const rec = getTodayRecord(studentId);
  if(rec){
    db.ref('attendance/' + rec.id).update({ checkOutTime: value });
  }else{
    db.ref('attendance').push({ studentId, date: todayStr(), status:'출석', checkInTime:'', checkOutTime: value, memo:'' });
  }
}

function rowHtml(stu){
  const rec = getTodayRecord(stu.id);
  const status = rec ? rec.status : null;
  let rowClass = '';
  let statusTag = `<span class="status-tag 대기">대기중</span>`;
  if(status === '결석'){ rowClass = 'absent'; statusTag = `<span class="status-tag 결석">결석</span>`; }
  else if(rec && rec.checkOutTime){ rowClass = 'checked-out'; statusTag = `<span class="status-tag 하원">하원 완료</span>`; }
  else if(rec && rec.checkInTime){ rowClass = 'checked-in'; statusTag = status === '지각' ? `<span class="status-tag 지각">지각</span>` : `<span class="status-tag 등원">등원 완료</span>`; }
  else if(rec && status){ rowClass = 'checked-in'; statusTag = `<span class="status-tag 등원">${escapeHtml(status)} 처리됨 (시간 미기록)</span>`; }

  const checkedIn = !!(rec && rec.checkInTime);
  const checkedOut = !!(rec && rec.checkOutTime);
  const isAbsent = status === '결석';
  const todayScheduled = getDayTime(stu, weekdayLabelOf(todayStr()));

  return `
    <div class="stu-row ${rowClass}">
      <div class="stu-name">
        <strong>${escapeHtml(stu.name)}</strong>
        <span class="badge">${escapeHtml(stu.grade)}</span>
        ${todayScheduled ? `<span style="font-size:11.5px;font-weight:700;background:#FFF3D6;color:#8A6400;padding:2px 8px;border-radius:6px;">오늘 ${escapeHtml(todayScheduled)}</span>` : ''}
        ${statusTag}
      </div>
      <div class="time-box">
        등원 <input type="time" value="${rec && rec.checkInTime ? rec.checkInTime : ''}" onchange="editCheckInTime('${stu.id}', this.value)">
        하원 <input type="time" value="${rec && rec.checkOutTime ? rec.checkOutTime : ''}" onchange="editCheckOutTime('${stu.id}', this.value)">
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <button class="btn ${checkedIn ? 'btn-ghost' : 'btn-success'}" onclick="checkIn('${stu.id}')">${checkedIn ? '↩ 등원 취소' : '등원 체크'}</button>
        ${checkedIn ? `<button class="btn ${checkedOut ? 'btn-ghost' : 'btn-primary'}" onclick="checkOut('${stu.id}')">${checkedOut ? '↩ 하원 취소' : '하원 체크'}</button>` : ''}
        <button class="btn ${isAbsent ? 'btn-ghost' : 'btn-danger-outline'}" onclick="markAbsent('${stu.id}')">${isAbsent ? '↩ 결석 취소' : '결석 처리'}</button>
        ${!stu.specialUntil && stu.memo && stu.memo.trim() ? (() => {
          const scheduleDays = WEEKDAYS.filter(d => stu.schedule && stu.schedule[d]).join('·');
          const memoText = scheduleDays ? `${scheduleDays} ${stu.memo}` : stu.memo;
          return `<span class="memo-pin">📌 ${escapeHtml(memoText)}</span>`;
        })() : ''}
      </div>
    </div>`;
}

function renderList(){
  const box = document.getElementById('studentList');
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const today = todayStr();
  const weekday = weekdayLabelOf(today);

  const elementaryStudents = students.filter(isElementary);

  let list;
  if(keyword){
    list = elementaryStudents.filter(s => s.name.toLowerCase().includes(keyword));
  }else{
    list = elementaryStudents.filter(s => getDayTime(s, weekday) || getTodayRecord(s.id));
  }
  list = list.sort((a,b) => {
    const ta = getDayTime(a, weekday) || '99:99';
    const tb = getDayTime(b, weekday) || '99:99';
    return ta.localeCompare(tb) || a.name.localeCompare(b.name, 'ko');
  });

  // 통계 (오늘 등원 예정 기준, 검색과 무관하게 항상 오늘 기준으로 계산)
  const expectedToday = elementaryStudents.filter(s => getDayTime(s, weekday) || getTodayRecord(s.id));
  const checkedIn = expectedToday.filter(s => { const r = getTodayRecord(s.id); return r && r.checkInTime; }).length;
  const checkedOut = expectedToday.filter(s => { const r = getTodayRecord(s.id); return r && r.checkOutTime; }).length;
  document.getElementById('statExpected').textContent = expectedToday.length;
  document.getElementById('statCheckedIn').textContent = checkedIn;
  document.getElementById('statCheckedOut').textContent = checkedOut;

  if(!elementaryStudents.length){
    box.innerHTML = `<div class="empty-msg">등록된 초등부 학생이 없습니다.</div>`;
    return;
  }
  if(!list.length){
    box.innerHTML = `<div class="empty-msg">${keyword ? '검색 결과가 없습니다.' : '오늘(' + weekday + '요일) 등원 예정인 초등부 학생이 없습니다.'}</div>`;
    return;
  }

  box.innerHTML = list.map(rowHtml).join('');
}

/* ===== 결석 학생 · 학부모님 전달사항 · 보강 진행(5분 단위) ===== */
function elemAbsenceKey(studentId, date){ return studentId + '_' + date; }

function getElemProgress(studentId, date){
  return elemMakeupProgress.find(p => p.studentId === studentId && p.date === date);
}

function fmtDateKR3(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m,10)}월 ${parseInt(d,10)}일(${weekdayLabelOf(dateStr)})`;
}

let elemPanelOpenKey = null; // 지금 펼쳐진 학생_날짜 key (한 번에 하나만 펼침)
let elemAbsenceCardOpen = false; // "보강관리" 카드 전체 접기/펼치기 (기본은 접힌 상태)
function toggleElemAbsenceCard(){
  elemAbsenceCardOpen = !elemAbsenceCardOpen;
  renderElemAbsenceList();
}

function toggleElemPanel(key){
  elemPanelOpenKey = (elemPanelOpenKey === key) ? null : key;
  renderElemAbsenceList();
}

function renderElemAbsenceList(){
  const card = document.getElementById('elemAbsenceCard');
  const box = document.getElementById('elemAbsenceList');
  if(!card || !box) return;

  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const start = `${d30.getFullYear()}-${String(d30.getMonth()+1).padStart(2,'0')}-${String(d30.getDate()).padStart(2,'0')}`;
  const end = todayStr();

  // 1) 최근 결석 중 아직 "보강없음" 처리 안 된 것들
  const absenceDates = attendance
    .filter(a => a.status === '결석' && a.date >= start && a.date <= end)
    .filter(a => !makeupDismissed[`${a.studentId}_${a.date}`])
    .map(a => ({ ...a, stu: students.find(s => s.id === a.studentId) }))
    .filter(a => a.stu && isElementary(a.stu));

  // 2) 원장님이 별도로 등록해준 보강 중 아직 안 끝난 것들 (결석 기록과 무관하게)
  const progressOnly = elemMakeupProgress
    .filter(p => (p.loggedMinutes || 0) < (p.targetMinutes || 60))
    .filter(p => !absenceDates.some(a => a.studentId === p.studentId && a.date === p.date))
    .map(p => ({ studentId: p.studentId, date: p.date, memo:'', stu: students.find(s => s.id === p.studentId) }))
    .filter(p => p.stu && isElementary(p.stu));

  const list = [...absenceDates, ...progressOnly]
    .map(a => {
      const weekday = weekdayLabelOf(a.date);
      const progress = getElemProgress(a.studentId, a.date);
      const target = progress && progress.targetMinutes ? progress.targetMinutes : getDayDuration(a.stu, weekday);
      const logged = progress ? Math.min(progress.loggedMinutes || 0, target) : 0;
      return { ...a, target, logged, remaining: target - logged, done: logged >= target };
    })
    .filter(a => !a.done); // 보강 다 끝난 건 목록에서 제외 - "보강 남은 애들"만 보여줌

  if(!list.length){ card.style.display = 'none'; return; }
  card.style.display = 'block';

  // 학생 한 명당 여러 결석 건이 있으면 하나로 묶어서, 총 남은시간과 함께 한 줄로 보여줌
  const byStudent = {};
  list.forEach(a => {
    if(!byStudent[a.studentId]) byStudent[a.studentId] = { stu: a.stu, entries: [] };
    byStudent[a.studentId].entries.push(a);
  });
  const studentGroups = Object.values(byStudent).map(g => ({
    ...g,
    entries: g.entries.sort((x,y) => y.date.localeCompare(x.date)),
    totalRemaining: g.entries.reduce((sum,e) => sum + e.remaining, 0)
  })).sort((a,b) => b.totalRemaining - a.totalRemaining);

  document.getElementById('elemAbsenceCountLabel').textContent = `보강 남은 학생 ${studentGroups.length}명`;
  document.getElementById('elemAbsenceToggleIcon').textContent = elemAbsenceCardOpen ? '▾' : '▸';
  box.style.display = elemAbsenceCardOpen ? 'block' : 'none';
  if(!elemAbsenceCardOpen) return; // 접혀있으면 내용은 그릴 필요 없음

  box.innerHTML = studentGroups.map(g => {
    const key = g.stu.id;
    const isOpen = elemPanelOpenKey === key;

    return `
      <div class="elem-mk-row">
        <div class="elem-mk-head" onclick="toggleElemPanel('${key}')">
          <span class="elem-mk-name">${escapeHtml(g.stu.name)}</span>
          <span class="elem-mk-grade">${escapeHtml(g.stu.grade)}</span>
          ${g.entries.length > 1 ? `<span style="font-size:10.5px;color:var(--color-text-muted);">결석 ${g.entries.length}건</span>` : `<span style="font-size:11px;color:var(--color-text-muted);">${fmtDateKR3(g.entries[0].date)}</span>`}
          <span class="elem-mk-remain">${g.totalRemaining}분 남음</span>
          <span style="font-size:10px;color:var(--color-primary);text-decoration:underline;cursor:pointer;" onclick="event.stopPropagation();resetElemTotalRemaining('${g.stu.id}')">✎ 직접설정</span>
          <span style="font-size:11px;color:var(--color-text-muted);">${isOpen ? '▾' : '▸'}</span>
        </div>
        ${isOpen ? g.entries.map(a => renderElemEntryBody(a, g.stu)).join('') : ''}
      </div>`;
  }).join('');
}

// 여러 결석건으로 흩어져 계산된 남은시간을, 원장님이 알고 있는 정확한 총 남은시간 숫자로 한 번에 리셋
function resetElemTotalRemaining(studentId){
  const stu = students.find(s => s.id === studentId);
  if(!stu) return;
  const existingProgress = elemMakeupProgress.filter(p => p.studentId === studentId && (p.loggedMinutes||0) < (p.targetMinutes||60));
  const currentTotal = existingProgress.reduce((sum,p) => sum + Math.max((p.targetMinutes||0)-(p.loggedMinutes||0),0), 0);
  const input = prompt(`${stu.name}의 정확한 총 남은 보강시간(분)을 입력해 주세요.\n(현재 화면 합산값: ${currentTotal}분)\n\n확인을 누르면 흩어져 있던 결석·보강 기록은 정리되고 이 숫자로 다시 설정돼요.`, currentTotal);
  if(input === null) return;
  const newTotal = parseInt(input, 10);
  if(isNaN(newTotal) || newTotal < 0){ alert('0 이상의 숫자를 입력해 주세요.'); return; }

  existingProgress.forEach(p => db.ref('elemMakeupProgress/' + p.id).remove());
  const undismissedAbsences = attendance.filter(a => a.studentId === studentId && a.status === '결석' && !makeupDismissed[`${a.studentId}_${a.date}`]);
  undismissedAbsences.forEach(a => db.ref(`makeupDismissed/${a.studentId}_${a.date}`).set(true));

  if(newTotal > 0){
    db.ref('elemMakeupProgress').push({ studentId, date: todayStr(), targetMinutes: newTotal, loggedMinutes: 0, log: [], createdAt: Date.now() });
  }
}

function renderElemEntryBody(a, stu){
  const progress = getElemProgress(a.studentId, a.date);
  const progressId = progress ? progress.id : null;
  const pct = a.target ? Math.min(100, Math.round((a.logged / a.target) * 100)) : 0;
  const msgs = parentMessages.filter(m => m.studentId === a.studentId).sort((x,y) => x.createdAt - y.createdAt);

  return `
    <div class="elem-mk-body" style="border-top:1px solid var(--color-border);">
      <div class="elem-mk-sub">${fmtDateKR3(a.date)} 결석${a.memo ? ` · ${escapeHtml(a.memo)}` : ''}</div>

      <div class="elem-mk-progress-box">
        <div class="elem-mk-bar"><div class="elem-mk-bar-fill" style="width:${pct}%;"></div></div>
        <div class="elem-mk-progress-txt"><b>${a.logged}분</b> 완료 · 목표 ${a.target}분</div>
      </div>

      <div class="elem-mk-add-box">
        <div class="elem-mk-sec-label add">보강 시간 추가</div>
        <div class="elem-mk-btn-row">
          <button class="elem-mk-btn add" onclick="addElemTarget('${a.studentId}','${a.date}',${a.target},10)">+10분</button>
          <button class="elem-mk-btn add" onclick="addElemTarget('${a.studentId}','${a.date}',${a.target},20)">+20분</button>
          <input type="number" id="target-elem-${a.studentId}-${a.date}" value="${a.target}" min="5" max="300" class="elem-mk-input">
          <button class="elem-mk-btn add" onclick="changeElemTargetByInput('${a.studentId}','${a.date}')">변경</button>
        </div>
      </div>

      <div class="elem-mk-deduct-box">
        <div class="elem-mk-sec-label deduct">보강 시간 차감</div>
        <div class="elem-mk-btn-row">
          <button class="elem-mk-btn deduct" onclick="quickElemMakeup('${a.studentId}','${a.date}',10)">-10분</button>
          <button class="elem-mk-btn deduct" onclick="quickElemMakeup('${a.studentId}','${a.date}',15)">-15분</button>
          <button class="elem-mk-btn deduct" onclick="quickElemMakeup('${a.studentId}','${a.date}',20)">-20분</button>
          ${a.remaining > 0 && ![10,15,20].includes(a.remaining) ? `<button class="elem-mk-btn deduct-done" onclick="if(confirm('${escapeHtml(stu.name)}의 보강 ${a.target}분을 전부 완료 처리할까요?')){quickElemMakeup('${a.studentId}','${a.date}',${a.remaining})}">-${a.remaining}분 완료</button>` : ''}
          <input type="number" id="direct-elem-${a.studentId}-${a.date}" value="${a.remaining}" min="1" max="300" class="elem-mk-input">
          <button class="elem-mk-btn apply" onclick="directElemMakeup('${a.studentId}','${a.date}')">반영</button>
        </div>
      </div>

      <div class="elem-mk-dismiss"><span onclick="dismissMakeup('${a.studentId}','${a.date}')">보강없음 (공휴일 등)</span></div>

      <div class="elem-mk-sec-label" style="margin-top:12px;">학부모 메시지</div>
      <div class="elem-mk-chat">
        ${msgs.length ? msgs.map(m => `<div class="elem-mk-bubble ${m.from}">${escapeHtml(m.text)}</div>`).join('') : `<div class="elem-mk-chat-empty">주고받은 메시지가 없어요.</div>`}
      </div>
      <div class="elem-mk-reply-row">
        <input type="text" id="reply-${a.studentId}" placeholder="답장 입력..." class="elem-mk-reply-input">
        <button class="elem-mk-btn apply" onclick="sendElemReply('${a.studentId}')">답장</button>
      </div>
    </div>`;
}

function adjustElemStep(key, delta){
  const cur = elemPendingAdjust[key] || 5;
  elemPendingAdjust[key] = Math.max(5, cur + delta);
  renderElemAbsenceList();
}

function quickElemMakeup(studentId, date, minutes){
  const existing = getElemProgress(studentId, date);
  const target = existing ? (existing.targetMinutes || 60) : 60;
  const prevLogged = existing ? (existing.loggedMinutes || 0) : 0;
  const newLogged = Math.min(prevLogged + minutes, target);
  const log = existing && existing.log ? existing.log.slice() : [];
  log.push({ minutes, at: Date.now(), sessionDate: todayStr() });
  if(existing){
    db.ref('elemMakeupProgress/' + existing.id).update({ loggedMinutes: newLogged, log });
  } else {
    db.ref('elemMakeupProgress').push({ studentId, date, targetMinutes: target, loggedMinutes: newLogged, log, createdAt: Date.now() });
  }
}

function directElemMakeup(studentId, date){
  const inputEl = document.getElementById(`direct-elem-${studentId}-${date}`);
  if(!inputEl) return;
  const minutes = parseInt(inputEl.value, 10);
  if(isNaN(minutes) || minutes < 1){ alert('1분 이상 입력해 주세요.'); return; }
  const existing = getElemProgress(studentId, date);
  const target = existing ? (existing.targetMinutes || 60) : 60;
  const prevLogged = existing ? (existing.loggedMinutes || 0) : 0;
  const newLogged = Math.min(prevLogged + minutes, target);
  const log = existing && existing.log ? existing.log.slice() : [];
  log.push({ minutes, at: Date.now(), sessionDate: todayStr() });
  if(existing){
    db.ref('elemMakeupProgress/' + existing.id).update({ loggedMinutes: newLogged, log });
  } else {
    db.ref('elemMakeupProgress').push({ studentId, date, targetMinutes: target, loggedMinutes: newLogged, log, createdAt: Date.now() });
  }
}

function changeElemTargetByInput(studentId, date){
  const inputEl = document.getElementById(`target-elem-${studentId}-${date}`);
  if(!inputEl) return;
  const newTarget = parseInt(inputEl.value, 10);
  if(isNaN(newTarget) || newTarget < 5){ alert('5분 이상 입력해 주세요.'); return; }
  const existing = getElemProgress(studentId, date);
  if(existing){
    db.ref('elemMakeupProgress/' + existing.id).update({ targetMinutes: newTarget });
  } else {
    db.ref('elemMakeupProgress').push({ studentId, date, targetMinutes: newTarget, loggedMinutes: 0, log: [], createdAt: Date.now() });
  }
}

// 오늘 결석한 시간 이외에 추가로 목표 시간을 늘림 (예: +10분, +20분)
function addElemTarget(studentId, date, currentTarget, addMinutes){
  const newTarget = currentTarget + addMinutes;
  const existing = getElemProgress(studentId, date);
  if(existing){
    db.ref('elemMakeupProgress/' + existing.id).update({ targetMinutes: newTarget });
  } else {
    db.ref('elemMakeupProgress').push({ studentId, date, targetMinutes: newTarget, loggedMinutes: 0, log: [], createdAt: Date.now() });
  }
}

function resetElemMakeup(progressId, studentId, date){
  if(!confirm('보강 완료를 취소하고 처음으로 되돌릴까요?\n적립된 기록이 모두 지워져요.')) return;
  if(progressId && progressId !== 'null'){
    db.ref('elemMakeupProgress/' + progressId).remove();
  } else {
    const prog = getElemProgress(studentId, date);
    if(prog) db.ref('elemMakeupProgress/' + prog.id).remove();
  }
}

function dismissMakeup(studentId, date){
  db.ref(`makeupDismissed/${studentId}_${date}`).set(true);
}

function saveElemMakeup(studentId, date, target){
  const key = elemAbsenceKey(studentId, date);
  const step = elemPendingAdjust[key] || 5;
  const existing = getElemProgress(studentId, date);
  const prevLogged = existing ? (existing.loggedMinutes || 0) : 0;
  const newLogged = Math.min(prevLogged + step, target);
  const log = existing && existing.log ? existing.log.slice() : [];
  log.push({ minutes: step, at: Date.now(), sessionDate: todayStr() });
  if(existing){
    db.ref('elemMakeupProgress/' + existing.id).update({ loggedMinutes: newLogged, log });
  }else{
    db.ref('elemMakeupProgress').push({ studentId, date, targetMinutes: target, loggedMinutes: newLogged, log, createdAt: Date.now() });
  }
  delete elemPendingAdjust[key];
}

function sendElemReply(studentId){
  const input = document.getElementById('reply-' + studentId);
  const text = input.value.trim();
  if(!text) return;
  db.ref('parentMessages').push({ studentId, from: 'staff', text, createdAt: Date.now(), read: true });
  input.value = '';
}

function mcSameTopic(a, b){
  if(a === b) return true;
  for(var i = 0; i < MC_DUP_KEYS.length; i++){
    var g = MC_DUP_KEYS[i], ha = false, hb = false;
    for(var k = 0; k < g.length; k++){
      if(a.indexOf(g[k]) >= 0) ha = true;
      if(b.indexOf(g[k]) >= 0) hb = true;
    }
    if(ha && hb) return true;
  }
  return false;
}
function mcTrim(list){
  var out = [];
  (list || []).forEach(function(x){
    var s = String((x && x.s) || '').trim();
    if(!s) return;
    for(var i = 0; i < out.length; i++){ if(mcSameTopic(String(out[i].s), s)) return; }
    out.push(x);
  });
  return out;
}

        else { var lead = q.splice(li,1)[0], tail = q.shift(); s = lead.j + ', ' + String(tail.s); }
      }
      var br = MC_BRIDGE[c];
      if(br && !first && firstOfCat){
        var w = br[tone], k = w.replace(/(에서도|에서는|에게는|과는|도$|은$|는$)/, '');
        if(s.indexOf(k) < 0) s = w + ' ' + s;                  /* 같은 말이 이미 있으면 안 붙인다 */
      }
      sents.push(s); first = false; firstOfCat = false;
    }
  });
  var fin = sents.map(function(t){ return /[.!?]$/.test(t) ? t : t + '.'; });
  if(head && fin.length) fin[0] = head + ' ' + fin[0];
  return fin;
}
/* 「~음 / ~함」 메모체를 「~습니다」로 바꾸고 이어쓰기도 만든다 */
function mcPolite(raw){
  var s = String(raw || '').trim().replace(/[.\s]+$/, '');
  if(!s) return null;
  if(/(습니다|ㅂ니다|입니다|세요|어요|아요|해요)$/.test(s)) return null;
  var L = s.charCodeAt(s.length - 1);
  if(L < 0xAC00 || L > 0xD7A3) return null;
  if((L - 0xAC00) % 28 !== 16) return null;                    /* 받침이 ㅁ 일 때만 손댄다 */
  var head = s.slice(0, -1), bare = String.fromCharCode(L - 16);
  if(bare === '\uC73C'){                                       /* 「음」 — 앞 글자에 붙인다 */
    if(!head) return null;
    return { s: head + '습니다', j: head + '고' };
  }
  var b = bare.charCodeAt(0);
  return { s: head + String.fromCharCode(b + 17) + '니다', j: head + bare + '고' };
}
function mcMake(stu, picks, memo){
  const good = picks.filter(p => p.t === 'g');
  const bad  = picks.filter(p => p.t === 'b' && mcCatKey(p.c) !== '가정');
  const home = picks.filter(p => p.t === 'b' && mcCatKey(p.c) === '가정');
  const sub = mcSubject(stu.name);
  const g = mcWeave(good), b = mcWeave(bad), hm = mcWeave(home);
  let parts = [];
  if(g.length){
    g[0] = (/이번 달|이달|한 달/.test(g[0]) ? sub : sub + ' 이번 달') + ' ' + g[0];
    parts = parts.concat(g);
  }
  if(memo && memo.trim()) parts.push(memo.trim().replace(/[.]*$/,'.'));
  /* 출결·성적은 원장님 관리 페이지에서 붙습니다 */
  if(b.length){
    b[0] = (g.length ? '다만 ' : sub + ' ') + b[0];
    parts = parts.concat(b);
    parts.push('조금 더 꼼꼼히 풀 수 있게 한 번씩 더 짚어 주고 있으니 너무 걱정하지 않으셔도 됩니다.');
  } else if(g.length) parts.push('다음 달에도 지금처럼만 해 주면 좋겠습니다.');
  if(hm.length) parts = parts.concat(hm);
  return mcMonthize(parts.join(' '));
}

function mcToggle(c,t,i){
  const stu = mcStu(); if(!stu) return;

/* =========================================================
   한 달 멘트 · 출결/성적 저절로 불러오기
========================================================= */
/* 한글 셈숫자 — 「여덟 번」처럼 쓰는 말 */
const MC_KNUM = ['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열',
  '열한','열두','열세','열네','열다섯','열여섯','열일곱','열여덟','열아홉','스무',
  '스물한','스물두','스물세','스물네','스물다섯','스물여섯','스물일곱','스물여덟','스물아홉','서른'];
function mcCnt(n){ n = Number(n) || 0; return MC_KNUM[n] || String(n); }
/* 받침을 보고 조사를 고른다 — 「영어는」 「수학은」 */
function mcJosa(w, withJong, noJong){
  var t = String(w || ''), c = t.charCodeAt(t.length - 1);
  var has = (c >= 0xAC00 && c <= 0xD7A3) ? ((c - 0xAC00) % 28) !== 0 : true;
  return t + (has ? withJong : noJong);
}
function mcMon(){ return mcM + '월'; }

function mcCatOf(grade){
  if(typeof gradeCategoryOf === 'function') return gradeCategoryOf(grade);
  var g = String(grade || '');
  return g.indexOf('초') === 0 ? '초등' : g.indexOf('중') === 0 ? '중등' : g.indexOf('고') === 0 ? '고등' : '기타';
}
/* 이 학생의 한 달 기준 횟수 — 중·고등 8회, 초등은 등원 요일 × 4 */
function mcBaseAuto(stu){
  if(!stu) return 8;
  if(mcCatOf(stu.grade) !== '초등') return 8;
  var d = WEEKDAYS.filter(function(w){ return stu.schedule && stu.schedule[w]; }).length;
  return d ? d * 4 : 8;
}
function mcBaseWhy(stu){
  if(!stu) return '';
  if(mcCatOf(stu.grade) !== '초등') return '중·고등 기본';
  var d = WEEKDAYS.filter(function(w){ return stu.schedule && stu.schedule[w]; }).length;
  return d ? ('주 ' + d + '회 × 4주') : '요일이 정해지지 않음';
}
function mcBaseOf(sid){
  var stu = mcFindStu(sid);
  /* ① 학생 카드에 정해 둔 값  ② 그 달만 따로 정한 값  ③ 등원 요일로 계산한 값 */
  var fixed = stu && stu.monthBase;
  if(fixed !== undefined && fixed !== null && fixed !== '') return Number(fixed) || 0;
  var r = mcRec(sid), v = r && r.base;
  if(v !== undefined && v !== null && v !== '') return Number(v) || 0;
  return mcBaseAuto(stu);
}
function mcFindStu(sid){ return students.find(function(s){ return s.id === sid; }); }
function mcSetBase(sid, v){
  var t = String(v == null ? '' : v).trim();
  var id = mcPickSafe(sid);
  /* 그 학생의 기준으로 저장한다 — 다음 달에도 그대로 쓰인다 */
  db.ref('students/' + id + '/monthBase').set(t === '' ? null : (Number(t) || 0));
  db.ref('monthComments/' + mcKey() + '/' + id + '/base').remove();
}
function mcPickSafe(sid){ return sid || mcPick; }

/* 이번 달 출결 숫자 */
function mcAttStat(sid){
  var pre = mcKey();
  var rows = (typeof attendance !== 'undefined' ? attendance : [])
    .filter(function(a){ return a.studentId === sid && String(a.date || '').slice(0,7) === pre; });
  var present = rows.filter(function(a){ return a.status === '출석'; }).length;
  var late    = rows.filter(function(a){ return a.status === '지각'; }).length;
  var absent  = rows.filter(function(a){ return a.status === '결석'; }).length;
  var mk = 0;
  if(typeof makeupSchedules !== 'undefined' && makeupSchedules)
    mk = makeupSchedules.filter(function(m){ return m.studentId === sid && String(m.date || '').slice(0,7) === pre; }).length;
  return { present: present + late, late: late, absent: absent, makeup: mk,
           base: mcBaseOf(sid), any: rows.length > 0 };
}
/* 출결 문장 */
function mcAttLine(sid){
  var a = mcAttStat(sid);
  if(!a.any) return '';
  var out = [], M = mcMon(), came = a.present, base = a.base;
  if(!came)
    out.push(M + '은 ' + mcCnt(base) + ' 번 수업이 있었는데 한 번도 나오지 못했습니다.');
  else if(came > base)
    out.push(M + '은 ' + mcCnt(base) + ' 번이 기준인데 보강까지 더해 ' + mcCnt(came) + ' 번 수업했습니다.');
  else if(came === base && !a.absent)
    out.push(M + '은 ' + mcCnt(base) + ' 번 수업 가운데 ' + mcCnt(came) + ' 번 모두 나와 주었습니다.');
  else
    out.push(M + '은 ' + mcCnt(base) + ' 번 수업 가운데 ' + mcCnt(came) + ' 번 나왔습니다.');
  if(a.absent && came < base){
    var left = a.absent - a.makeup;
    if(a.makeup >= a.absent) out.push('빠진 ' + mcCnt(a.absent) + ' 번은 ' + (a.absent > 1 ? '모두 ' : '') + '보강으로 채웠습니다.');
    else if(a.makeup > 0) out.push('빠진 ' + mcCnt(a.absent) + ' 번 가운데 ' + mcCnt(a.makeup) +
      ' 번은 보강으로 채웠고, ' + mcCnt(left) + ' 번은 아직 남아 있습니다.');
    else out.push('빠진 ' + mcCnt(a.absent) + ' 번은 아직 보강으로 채우지 못했습니다.');
  }
  /* 초등은 지각을 출석에 넣어 세므로 따로 말하지 않는다 */
  return out.join(' ');
}

/* 성적 — 가장 최근 시험의 과목들 (중·고등만 쓰임) */
function mcScoreStat(sid){
  if(typeof scores === 'undefined' || !scores) return null;
  var ord = function(e){ return (typeof EXAM_PERIODS !== 'undefined' ? EXAM_PERIODS : []).indexOf(e); };
  var mine = scores.filter(function(x){ return x.studentId === sid; });
  if(!mine.length) return null;
  var lastExam = mine.slice().sort(function(a,b){ return ord(b.examName) - ord(a.examName); })[0].examName;
  var rows = mine.filter(function(x){ return x.examName === lastExam; })
    .map(function(x){
      var prev = mine.filter(function(y){ return y.subject === x.subject && ord(y.examName) < ord(lastExam); })
        .sort(function(a,b){ return ord(b.examName) - ord(a.examName); })[0];
      return { subject: x.subject, score: Number(x.score) || 0,
               diff: prev ? (Number(x.score) - Number(prev.score)) : null };
    });
  return rows.length ? { exam: lastExam, rows: rows } : null;
}
function mcScoreLine(sid){
  var s = mcScoreStat(sid);
  if(!s) return '';
  var parts = s.rows.map(function(r, i){
    var head = (i === 0) ? (s.exam + '에서 ' + r.subject + ' ' + r.score + '점')
                         : (mcJosa(r.subject, '은', '는') + ' ' + r.score + '점');
    var tail = (i === 0) ? '지난 시험보다 ' : '';
    if(r.diff === null) return head + '을 받았습니다.';
    if(r.diff === 0)    return head + '으로 ' + (i === 0 ? '지난 시험과 같았습니다.' : '지난번과 같았습니다.');
    if(r.diff > 0)      return head + '으로 ' + tail + r.diff + '점 올랐습니다.';
    return head + '으로 ' + tail + Math.abs(r.diff) + '점 내려갔습니다.';
  });
  return parts.join(' ');
}

/* 「이번 달」을 「9월」로 바꿔 준다 */
function mcMonthize(t){
  var M = mcMon();
  return String(t || '')
    .replace(/이번 달도/g, M + '에도')
    .replace(/이번 달에는/g, M + '에는')
    .replace(/이번 달에/g, M + '에')
    .replace(/이번 달은/g, M + '은')
    .replace(/이번 달 /g, M + '에 ')
    .replace(/이번 달/g, M);
}


/* ---- 중·고등 청구 머리말 ---- */
function mcBillMonth(){ return mcM === 12 ? 1 : mcM + 1; }
function mcWeekCnt(stu){
  return WEEKDAYS.filter(function(w){ return stu && stu.schedule && stu.schedule[w]; }).length;
}
/* 출결 문장 — 청구 머리말용 (숫자로 씁니다) */
function mcAttLineNum(sid){
  var a = mcAttStat(sid);
  if(!a.any) return '';
  var out = [], M = mcM + '월', came = a.present, base = a.base;
  if(!came) out.push(M + '은 ' + base + '회 수업이 있었는데 한 번도 나오지 못했습니다.');
  else if(came > base) out.push(M + '은 ' + base + '회 수업 중 보강까지 더해 ' + came + '회 수업했습니다.');
  else if(came === base && !a.absent) out.push(M + '은 ' + base + '회 수업을 모두 채웠습니다.');
  else out.push(M + '은 ' + base + '회 수업 중 ' + came + '회 수업했습니다.');
  if(a.absent && came < base){
    var left = a.absent - a.makeup;
    if(a.makeup >= a.absent) out.push('빠진 ' + a.absent + '회는 ' + (a.absent > 1 ? '모두 ' : '') + '보강으로 채웠습니다.');
    else if(a.makeup > 0) out.push('빠진 ' + a.absent + '회 중 ' + a.makeup + '회는 보강으로 채웠고, ' + left + '회는 아직 남아 있습니다.');
    else out.push('빠진 ' + a.absent + '회는 아직 보강으로 채우지 못했습니다.');
  }
  if(a.late) out.push('늦게 온 날도 ' + a.late + '회 있었습니다.');
  return out.join(' ');
}
/* 중·고등이면 앞에 붙는 세 문장 */
function mcLeadLines(stu){
  if(mcCatOf(stu.grade) === '초등') return [];
  var rec = mcRec(stu.id) || {}, base = mcBaseOf(stu.id), wk = mcWeekCnt(stu);
  var lead = ['안녕하세요 ' + mcBillMonth() + '월 수업료 청구드립니다.'];
  lead.push((wk ? '주' + wk + '회 ' : '') + '월 ' + base + '회 기준 수업료입니다.');
  if(rec.noAtt !== true){ var al = mcAttLineNum(stu.id); if(al) lead.push(al); }
  return lead;
}


/* 이 학생 이 달 멘트를 통째로 지운다 */
function mcClear(){
  if(!mcPick) return;
  var stu = mcFindStu(mcPick);
  if(!confirm((stu ? stu.name : '이 학생') + ' ' + mcM + '월 멘트를 지울까요?\n고른 칩과 쓴 글이 모두 없어집니다.')) return;
  db.ref('monthComments/' + mcKey() + '/' + mcPick).remove();
  mcDraft = { picks: [], memo: '', text: '' };
  setTimeout(function(){
    mcRemake();
    if(typeof renderMc === 'function') renderMc(); else renderMonthly();
  }, 250);
}

/* 자동 상자 그리기 */
function mcAutoHtml(stu, locked){
  var sid = stu.id, rec = mcRec(sid) || {};
  var a = mcAttStat(sid), sc = mcScoreStat(sid);
  var offA = rec.noAtt === true, offS = rec.noScore === true;
  var h = '';
  if(a.any){
    var manual = stu.monthBase !== undefined && stu.monthBase !== null && stu.monthBase !== '';
    h += '<div class="mc-auto"><div class="mc-auto-h">📋 ' + mcMon() + ' 출결 <span class="auto">저절로 불러옴</span></div>' +
      '<div class="mc-base">기준 <input type="number" min="0" step="1" value="' + a.base + '" ' + (locked ? 'disabled ' : '') +
        'onchange="mcSetBase(\'' + sid + '\',this.value)"> 회 · ' +
        (manual ? '<b style="color:#4338ca">직접 정함 · 모든 달에 그대로</b> <span style="opacity:.7">(자동이면 ' +
                  mcBaseAuto(stu) + '회 · ' + escapeHtml(mcBaseWhy(stu)) + ')</span>'
                : escapeHtml(mcBaseWhy(stu))) + '</div>' +
      '<div class="mc-nums">' +
        '<div class="mc-num base"><b>' + a.base + '</b><span>기준</span></div>' +
        '<div class="mc-num ok"><b>' + a.present + '</b><span>출석</span></div>' +
        (a.late ? '<div class="mc-num late" title="지각도 출석으로 세어 이야기합니다"><b>' + a.late +
          '</b><span>지각<br><i style="font-style:normal;opacity:.7">출석에 포함</i></span></div>' : '') +
        '<div class="mc-num bad"><b>' + a.absent + '</b><span>결석</span></div>' +
        (a.makeup ? '<div class="mc-num mk"><b>' + a.makeup + '</b><span>보강함</span></div>' : '') +
      '</div>' +
      '<label class="mc-sw"><input type="checkbox"' + (offA ? '' : ' checked') + (locked ? ' disabled' : '') +
        ' onchange="mcToggleAuto(\'att\',this.checked)"> 이 내용을 멘트에 넣기</label>' +
      '<div class="mc-pv">' + escapeHtml(mcCatOf(stu.grade) === '초등' ? mcAttLine(sid) : mcAttLineNum(sid)) + '</div></div>';
  }
  if(sc){
    h += '<div class="mc-auto"><div class="mc-auto-h">📝 성적 <span class="auto">' + escapeHtml(sc.exam) + '</span></div>';
    sc.rows.forEach(function(r){
      var tag = r.diff === null ? '<span class="fl">지난 기록 없음</span>'
        : r.diff > 0 ? '<span class="up">▲ +' + r.diff + '점</span>'
        : r.diff < 0 ? '<span class="dn">▼ −' + Math.abs(r.diff) + '점</span>'
        : '<span class="fl">지난 시험과 같음</span>';
      h += '<div class="sc-row"><span class="sub">' + escapeHtml(r.subject) + '</span>' +
        '<span class="pt">' + r.score + '점</span>' + tag + '</div>';
    });
    h += '<label class="mc-sw"><input type="checkbox"' + (offS ? '' : ' checked') + (locked ? ' disabled' : '') +
      ' onchange="mcToggleAuto(\'score\',this.checked)"> 이 내용을 멘트에 넣기</label>' +
      '<div class="mc-pv">' + escapeHtml(mcScoreLine(sid)) + '</div></div>';
  }
  return h;
}
function mcToggleAuto(kind, on){
  if(!mcPick) return;
  db.ref('monthComments/' + mcKey() + '/' + mcPick + '/' + (kind === 'att' ? 'noAtt' : 'noScore')).set(on ? null : true);
  setTimeout(function(){ mcRemake(); if(typeof renderMcPane === 'function') renderMcPane(); else renderMonthlyPane(); }, 250);
}

</script>
